services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=sqlite:////data/app.db
      - SESSION_SECRET=${SESSION_SECRET}
      - COOKIE_SECURE=${COOKIE_SECURE:-1}
    volumes:
      - api-data:/data
      - ./backups:/backups
    expose:
      - "8000"
    restart: unless-stopped
    networks:
      - finapp

  nginx:
    build:
      context: .
      dockerfile: docker/nginx.Dockerfile
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/rendered.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    # Продление сертификата: certbot обновляет файлы, nginx перечитывает их раз в 6ч
    command: >
      /bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done &
      nginx -g "daemon off;"'
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - finapp

  certbot:
    image: certbot/certbot
    volumes:
      - ./ssl:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done'
    networks:
      - finapp

volumes:
  api-data:
  certbot-www:

networks:
  finapp:
    driver: bridge
